# =====================================================================
# TYPELY — dos contenedores, desplegados por Coolify.
#
# Cambios respecto de la versión anterior, y por qué:
#
#  1. SIN `secrets:`. El compose viejo montaba secretos de Docker desde
#     ./secrets/*.txt, archivos que (correctamente) NO están en el repo.
#     Docker Compose falla al arrancar si un `file:` declarado no existe,
#     así que en Coolify nunca podría levantar. Ahora los valores llegan
#     como variables de entorno, que es donde Coolify las guarda cifradas.
#
#  2. `expose` en vez de `ports`. Ya no publicamos 3005/3006 en el host:
#     el proxy de Coolify (Traefik) llega a los contenedores por la red
#     interna. Publicar puertos acá solo abriría superficie de más.
#
#  3. Sin servicio `db`. La base es un recurso Postgres administrado por
#     Coolify — se crea aparte y se conecta por DATABASE_URL. Así queda
#     dentro de su sistema de backups programados.
#
# El único dominio público apunta al servicio `mecanografia`; nginx
# reenvía /api/* al servicio `api` por la red interna (ver nginx.conf).
# =====================================================================

services:
  # ------------------------------------------------------------------
  # API Fastify — auth, usuarios, grupos, progreso y analítica.
  # No lleva dominio propio: se llega a ella por /api/* del frontend.
  # ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Postgres administrado por Coolify. Usá la URL INTERNA que muestra
      # el recurso, no la pública.
      DATABASE_URL: "${DATABASE_URL}"
      # Secreto de firma de los JWT. Si cambia, se caen todas las sesiones.
      JWT_SECRET: "${JWT_SECRET}"
      # Orígenes permitidos por CORS, separados por coma.
      CORS_ORIGIN: "${CORS_ORIGIN:-https://typely.becode.com.ar,https://www.typely.becode.com.ar}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-https://typely.becode.com.ar}"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ------------------------------------------------------------------
  # Frontend — Vite compilado a estáticos, servidos por nginx, que además
  # hace de proxy hacia la API. Este es el servicio que lleva el dominio.
  # ------------------------------------------------------------------
  mecanografia:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify inyecta acá el dominio que le asignes al servicio.
      SERVICE_FQDN_MECANOGRAFIA_80: "${SERVICE_FQDN_MECANOGRAFIA_80:-}"
    expose:
      - "80"
    depends_on:
      - api
